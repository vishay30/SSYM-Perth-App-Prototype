<html lang="en">
<head>

<style>
:root{--bg:#f3f5f9;--surf:#fff;--ink:#16203a;--mute:#5d6783;--line:#dde2ee;--pri:#1f2f6b;--onpri:#fff;--acc:#f2a900;--ok:#1f8a5b;--bad:#b4331a;

body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--bf,Figtree),system-ui,sans-serif;padding-bottom:84px}

header{background:var(--pri);color:var(--onpri);padding:12px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:760px;margin:auto}
header b{font:700 1.25rem 'Bricolage Grotesque',sans-serif}
select,input,textarea,button{font:inherit;color:inherit}

.pt .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-weight:600;font-size:.9rem;line-height:1.25}
.pt .st{position:absolute;top:8px;left:8px;background:var(--surf)}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:5;max-width:736px;margin:auto}
.banner{position:relative;height:130px;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;margin-bottom:12px}
.banner b{font:700 1.7rem/1.1 'Bricolage Grotesque',sans-serif}.banner small{opacity:.9}
input[type=range]{accent-color:var(--pri);height:28px}
.gear{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.35);color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:1.2rem;cursor:pointer}
.pbig{width:100%;border-radius:12px;display:block;margin-bottom:10px}
.note{font-size:.88rem;color:var(--mute);border-left:3px solid var(--acc);padding-left:10px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{text-align:left;padding:7px 4px;border-top:1px solid var(--line)}.scroll{overflow-x:auto}
.tick{width:22px;height:22px;border:2px solid var(--mute);border-radius:5px;display:inline-block}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>

<script>
const ROLES=[['mc','MC Representative'],['ym_lead','YM Lead'],['bm_lead','Bal Mandal Lead'],['ym_member','YM Member'],['bm_teacher','Bal Mandal Teacher'],['bm_parent','Bal Mandal Parent'],['app_admin','App Admin']];
const RN=Object.fromEntries(ROLES);
const A={mehul:{n:'Mehul Gopal',g:'Vairagya',s:'yk',r:['bm_lead','ym_lead']},vikram:{n:'Rajan Hirani',g:'Bhakti',s:'yk',r:['mc']},priya:{n:'Priya Patel',g:'Padma',s:'yv',r:['ym_member']},arjun:{n:'Arjun Desai',g:'Dharma',s:'yk',r:['ym_lead']},meera:{n:'Meera Patel',g:'Shankh',s:'yv',r:['bm_teacher','ym_member'],c:'Gaupad 1'},anita:{n:'Anita Modi',g:'Padma',s:'yv',r:['ym_member','bm_parent'],c:'Gaupad 1'},sanjay:{n:'Sanjay Rao',g:'Vairagya',s:null,r:[]},appdev:{n:'App Admin Team',g:'',s:null,main:true,r:['app_admin']}};

const LES=[];CL.forEach((c,i)=>TOP[i].forEach((t,j)=>LES.push({id:LES.length,c,t,d:['Oct 30','Nov 6','Nov 13'][j]})));
const SES=[['Oct','Oct 9','Bhakti and daily niyam'],['Oct','Oct 16','Seva in everyday life'],['Oct','Oct 23','Understanding Satsang'],['Oct','Oct 30','Festival of Diwali'],['Nov','Nov 6','Gunatit Guru'],['Nov','Nov 13','Youth and purpose'],['Nov','Nov 20','Patotsav preparation'],['Nov','Nov 27','Review and reflection']].map((s,i)=>({id:i,m:s[0],d:s[1],t:s[2],pub:i<3}));

const BE=[['Nov 14','Gift distribution day'],['Nov 22','Bal Mandal outing'],['Dec 6','Kids shibir'],['Dec 12','Parent info night','Gaupad 1'],['Dec 19','Kids cultural evening'],['Jan 9','Patotsav 2027']];
const BASIC=['ym.ses','ym.res','ym.idea','ym.cal','niy'];
const mkDocs=(l,p)=>l.map((n,i)=>({id:p+i,n,b:n==='Budget'?'Item\tAmount\nHall hire\t$250\nPrinting\t$80\n':'',by:'',at:''}));
const S={re:{ym_member:[],ym_lead:['ym.ses','ym.res','ym.idea','ym.cal','ym.att','ym.tasks','ym.adm','niy'],bm_teacher:['bm.att'],bm_lead:['bm.att','bm.lst','bm.bdoc','bm.cal'],bm_parent:[],mc:['ym.ses','ym.res','ym.idea','ym.cal','ym.att','ym.tasks','ym.adm','niy','bm.att','bm.lst','bm.bdoc','bm.cal','acc.manage'],app_admin:['acc.manage','niy']},pend:[],rd:{},ad:{},bin:[],bc:0,pres:{},doc:null,lf:'all',lsub:'log',rt:{ym_member:[...BASIC],ym_lead:[...BASIC,'ym.grp','ym.att','ym.tasks','ym.adm'],bm_teacher:[...BASIC,'bm.syl','bm.att','bm.lst','bm.cal'],bm_lead:[...BASIC,'bm.ovr','bm.syl','bm.att','bm.lst','bm.bdoc','bm.cal'],bm_parent:['bm.cal'],mc:[...BASIC,'ym.grp','ym.att','ym.tasks','ym.adm','bm.ovr','bm.syl','bm.att','bm.lst','bm.bdoc','bm.cal','acc.manage'],app_admin:['acc.manage']},ropen:{},mock:null,launched:false,custom:{},asub:'acc',tk:null,rego:{},gtab:{s:'yk',g:'Gnan'},gban:{},bdocs:mkDocs(['Gift lists','Event checklist','Permission forms','Teacher contacts','Syllabus master','Templates'],'b'),teams:[{k:'ym',n:'YM Interactive',img:''},{k:'bm',n:'Bal Mandal',img:''}],tasks:[{id:1,t:'Design Patotsav poster',u:'priya',due:'Nov 6',p:40,nudge:[]},{id:2,t:'Book hall for November session',u:'arjun',due:'Nov 1',p:0,nudge:[]},{id:3,t:'Collect new member forms',u:'mehul',due:'Nov 13',p:0,nudge:[]},{id:4,t:'Prepare Diwali slides',u:'meera',due:'Oct 30',p:100,nudge:[]}],reqs:[],aq:'',pick:null,poster:{},notes:{},prof:{},saved:'',look:{theme:'auto',size:'16px',font:'f1'},niy:[['Janmangal','Daily niyam'],['Ashtak','Daily niyam'],['Kirtan niyam (sample)','Kirtan niyam']],me:'mehul',tab:'home',sub:{ym:'ses',bm:null},month:'Oct',open:null,fold:null,cf:null,q:'',rq:'',ideas:[],reg:{},ppt:{0:{all:'Week1_Bhakti.pptx'}},bmClass:'Gaupad 1',log:[],
res:[['Agnas that apply to our ashram','rules niyam ashram agna'],['The 14 Loks','lok cosmology'],['Our hierarchy: Bhuj Sampraday','bhuj sampraday hierarchy parampara'],['Leelas of Bhagwan coming down','bhagwan avatar leela leelas']],
docs:mkDocs(['Guidelines','Budget','Event checklist','Permission forms','Contact list','Templates'],'y'),
plan:[['Oct','arjun','Bhakti and daily niyam'],['Nov','mehul','Gunatit Guru and Patotsav'],['Dec','arjun','Seva and service'],['Jan','mehul','Patotsav 2027'],['Feb','priya','Youth and purpose'],['Mar','arjun','Review and handover']]};
const $=s=>document.querySelector(s);
const GROUPS={yk:['Gnan','Bhakti','Vairagya','Dharma'],yv:['Gada','Vajra','Shankh','Vyom','Vajra 2','Chakra','Padma']};
const GL={yk:'Yuvak (boy)',yv:'Yuvati (girl)'};
const canAssign=()=>has('app_admin')||canEdit('acc.manage');
const gen=()=>S.mock?S.mock.s:A[S.me].s;
const needsGender=()=>!gen()&&!(has('app_admin')&&!yma()&&!bma());
const canExplicit=k=>[...roles(S.me)].some(r=>(S.rt[r]||[]).includes(k));
const can=k=>canExplicit(k)||(k==='ym.tasks'&&S.tasks.some(x=>x.u===S.me));
const noAccess=()=>'<div class="card"><h3>Nothing to show yet</h3><p class="sub">No tabs are turned on for your role. Ask the App Admin team.</p></div>';
const TABCAT=[['YM Interactive',[['ym.ses','Sessions'],['ym.res','Resources'],['ym.idea','Ideas'],['ym.cal','Calendar'],['ym.grp','Groups'],['ym.att','Attendance'],['ym.tasks','Tasks'],['ym.adm','Admin and documents'],['niy','Nitya Niyams']]],['Bal Mandal',[['bm.ovr','Overview'],['bm.syl','Syllabus'],['bm.att','Attendance'],['bm.lst','Class lists'],['bm.bdoc','Documents'],['bm.cal','Calendar']]],['Administration',[['acc.manage','Assign roles and groups']]]];
const canEdit=k=>[...roles(S.me)].some(r=>(S.re[r]||[]).includes(k));
const canLog=()=>has('mc')||has('app_admin');
const TN=Object.fromEntries(TABCAT.flatMap(x=>x[1]));
const tm=()=>{const d=new Date();let h=d.getHours();const ap=h>=12?'pm':'am';h=h%12||12;return h+'.'+String(d.getMinutes()).padStart(2,'0')+ap};
const logit=(m,k='change')=>S.log.unshift({k,txt:`${A[S.me].n}${S.mock?' (previewing '+S.mock.n+')':''}: ${m} · ${tm()}`});
const toast=m=>{const e=$('#toast');e.textContent=m||'Saved. Others will see this when they restart the app.';e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>{e.style.display='none'},4500)};
const binAdd=(kind,label,data)=>{S.bin.unshift({id:++S.bc,kind,label,by:S.me,at:tm(),data});logit(`moved ${label} to the bin`,'bin');toast('Moved to the bin. The MC representative or App Admin can restore it.')};
const restoreBin=b=>{const x=b.data;if(b.kind==='event')(x.k==='ym'?YE:BE).push(x.e);else if(b.kind==='doc')(x.list==='docs'?S.docs:S.bdocs).push(x.doc);else if(b.kind==='team')S.teams.push(x.team);else if(b.kind==='group'){GROUPS[x.sx].push(x.name);x.holders.forEach(u=>{A[u].g=x.name})}else if(b.kind==='role'){ROLES.push([x.id,x.name]);RN[x.id]=x.name;S.custom[x.id]=true;S.rt[x.id]=x.v;S.re[x.id]=x.e;x.holders.forEach(u=>A[u].r.push(x.id))}};
function flushDoc(){clearTimeout(S.dt);const p=S.dpend;if(!p)return;S.dpend=null;const isY=S.docs.find(x=>x.id===p.id),d=isY||S.bdocs.find(x=>x.id===p.id);if(!d||p.v===d.b)return;if(!(isY?canEdit('ym.adm'):canEdit('bm.bdoc'))||S.mock)return;d.b=p.v;d.by=S.me;d.at=tm();const key=S.me+'|'+d.id,txt=`${A[S.me].n} saved changes to '${d.n}' ${d.at}`;if(S.log[0]&&S.log[0].key===key)S.log[0]={k:'doc',key,txt};else S.log.unshift({k:'doc',key,txt});const e=$('#sv');if(e)e.textContent='Saved by '+A[S.me].n+' at '+d.at}
function closeDoc(){flushDoc();if(S.doc&&S.pres[S.doc.id])S.pres[S.doc.id]=S.pres[S.doc.id].filter(u=>u!==S.me);S.doc=null}
const effRole=id=>{const p=S.pend.find(x=>x.k==='rt'&&x.id===id);return S.rd[id]||(p?{v:[...p.v],e:[...p.e]}:{v:[...(S.rt[id]||[])],e:[...(S.re[id]||[])]})};
const effAcct=u=>{const p=S.pend.find(x=>x.k==='acct'&&x.u===u);return S.ad[u]||(p?{r:[...p.r],g:p.g}:{r:[...A[u].r],g:A[u].g})};
const pendLabel=p=>p.k==='rt'?`Role ${RN[p.id]}: tab access updated`:`${A[p.u].n}: roles or group updated`;
const pendBar=()=>S.pend.length?`<div class="card" style="background:var(--acc);color:#16203a;border:0"><div class="row"><b>${S.pend.length} change${S.pend.length>1?'s':''} waiting</b><span style="display:flex;gap:6px"><button class="btn sm" data-act="confirm">Confirm changes</button><button class="btn alt sm" data-act="discard" style="color:#16203a;border-color:#16203a">Discard</button></span></div><div style="font-size:.9rem;margin-top:6px">${S.pend.map(p=>esc(pendLabel(p))).join('<br>')}</div></div>`:'';
const applyPend=()=>{S.pend.forEach(p=>{if(p.k==='rt'){const ov=S.rt[p.id]||[],oe=S.re[p.id]||[],L=(a,w)=>a.length?w+' '+a.map(k=>TN[k]||k).join(', ')+'; ':'';S.rt[p.id]=p.v;S.re[p.id]=p.e;logit(`Updated ${RN[p.id]}: ${L(p.v.filter(k=>!ov.includes(k)),'view +')}${L(ov.filter(k=>!p.v.includes(k)),'view -')}${L(p.e.filter(k=>!oe.includes(k)),'edit +')}${L(oe.filter(k=>!p.e.includes(k)),'edit -')}`.trim(),'role')}else{const a=A[p.u],ad=p.r.filter(r=>!a.r.includes(r)).map(r=>RN[r]),rm=a.r.filter(r=>!p.r.includes(r)).map(r=>RN[r]),og=a.g;a.r=p.r;a.g=p.g;logit(`Updated ${a.n}: ${ad.length?'added '+ad.join(', ')+'; ':''}${rm.length?'removed '+rm.join(', ')+'; ':''}${og!==p.g?'group '+(og||'none')+' to '+(p.g||'none'):''}`.trim(),'role')}});S.pend=[];toast('Changes confirmed. People will see them when they restart the app.')};

const GRANTS=[['ym_member','View YM sessions, resources, ideas and niyams'],['ym_lead','YM lead tools: groups, attendance, tasks, documents, calendar'],['bm_teacher','BM syllabus, registers and class lists'],['bm_lead','BM lead tools: overview, documents, calendar, gift lists'],['bm_parent','BM calendar for their child\'s class']];
const RD={mc:'Oversees YM and Bal Mandal, approves ideas, searches accounts',ym_lead:'YM groups, attendance, tasks, documents, calendar',bm_lead:'BM overview, class lists, documents, calendar, registers',ym_member:'YM sessions, resources, ideas, niyams',bm_teacher:'BM syllabus, registers, class lists',bm_parent:'BM calendar for their own class',app_admin:'Accounts, roles, teams, niyams, previews'};

else if(d.act==='addtask'&&canEdit('ym.tasks')){const t=$('#tt').value.trim();if(!t){$('#tt').focus();return}S.tasks.push({id:Date.now(),t,u:$('#tu').value,due:$('#td').value.trim()||'No date',p:0,nudge:[]})}
else if(d.act&&d.act.startsWith('addev:')){const k=d.act.slice(6),dt=$('#evd').value.trim(),n=$('#evt').value.trim();if(canEdit(k==='ym'?'ym.cal':'bm.cal')&&dt&&n)(k==='ym'?YE:BE).push(k==='bm'&&$('#evc').value?[dt,n,$('#evc').value]:[dt,n])}
else if(d.act==='addteam'&&has('app_admin')){const n=$('#nteam').value.trim();if(n){S.teams.push({k:'t'+Date.now(),n,c:true,img:''});logit('Added team '+n)}}
else if(d.act&&d.act.startsWith('addgrp:')&&has('app_admin')){const sx=d.act.slice(7),n=$('#ng_'+sx).value.trim();if(n&&!GROUPS[sx].includes(n)){GROUPS[sx].push(n);logit('Added group '+n)}}
else if(d.act==='addrole'&&has('app_admin')){const n=$('#rn').value.trim(),e=[...document.querySelectorAll('.nre:checked')].map(x=>x.value),g=[...new Set([...document.querySelectorAll('.nrv:checked')].map(x=>x.value).concat(e))];if(n&&g.length){const id='c'+Date.now();ROLES.push([id,n]);RN[id]=n;S.custom[id]=true;S.rt[id]=g;S.re[id]=e;logit('Created role '+n,'role')}}
else if(d.act==='saveprof')S.saved='prof';else if(d.act==='savepw')S.saved=($('#pw2').value.length>=8)?'pw':'pwbad';else if(d.act==='print'){try{window.print()}catch(x){}return}
draw()});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
if(d.note!==undefined){S.notes=S.notes||{};S.notes[d.note]=t.value}
else if(d.q==='syl'){S.q=t.value;$('#fl').innerHTML=folders()}
else if(d.q==='res'){S.rq=t.value;$('#rl').innerHTML=resList()}else if(d.q==='acc'){S.aq=t.value;$('#al').innerHTML=accList()}else if(d.docbody!==undefined){S.dpend={id:d.docbody,v:t.value};clearTimeout(S.dt);const e=$('#sv');if(e)e.textContent='Saving…';S.dt=setTimeout(flushDoc,900)}else if(d.prog!==undefined){const x=S.tasks.find(y=>y.id==d.prog);if(x&&x.u===S.me){x.p=+t.value;t.nextElementSibling.textContent=t.value+'%'}}else if(d.prof)(S.prof[S.me]=S.prof[S.me]||{})[d.prof]=t.value});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if((t.type==='text'||t.type==='password'||t.type==='checkbox'||t.tagName==='TEXTAREA')&&d.gname===undefined&&d.tname===undefined&&d.rg===undefined&&d.crn===undefined&&d.rv===undefined&&d.re===undefined)return;
if(d.plan!==undefined||d.ppt!==undefined||d.poster!==undefined||d.addres!==undefined||d.addniy!==undefined){logit('updated '+(d.plan!==undefined?'the year plan':d.addres!==undefined?'resources':d.addniy!==undefined?'niyams':'session files'));toast()}
if(t.id==='who'){flushDoc();S.me=t.value;S.doc=null;Object.keys(S.pres).forEach(k=>{S.pres[k]=S.pres[k].filter(u=>u!==S.me)});S.tab='home';S.cf=null;S.sub={ym:'ses',bm:null};S.open=null;S.fold=null;S.saved='';S.pick=null;S.aq='';S.mock=null}
else if(d.bmc!==undefined)S.bmClass=t.value;
else if(d.plan!==undefined){if(canEdit('ym.adm'))S.plan[+d.plan][1]=t.value}
else if(d.gname!==undefined){if(has('app_admin')){const[sx,i]=d.gname.split(':'),old=GROUPS[sx][+i],nu=t.value.trim();if(nu&&nu!==old&&!GROUPS[sx].includes(nu)){GROUPS[sx][+i]=nu;Object.values(A).forEach(a=>{if(a.g===old&&a.s===sx)a.g=nu});if(S.gban[old]){S.gban[nu]=S.gban[old];delete S.gban[old]}logit(`Renamed group ${old} to ${nu}`)}}}
else if(d.tname!==undefined){if(has('app_admin')){const x=S.teams.find(y=>y.k===d.tname);if(x&&t.value.trim()){x.n=t.value.trim();logit('Renamed team to '+x.n)}}}
else if(d.tthumb!==undefined){const f=t.files[0],x=S.teams.find(y=>y.k===d.tthumb);if(f&&x&&has('app_admin')){const rd=new FileReader();rd.onload=()=>{x.img=rd.result;logit('Updated thumbnail for '+x.n);draw()};rd.readAsDataURL(f)}}
else if(d.gban!==undefined){const f=t.files[0],[sx,i]=d.gban.split(':'),g=GROUPS[sx][+i];if(f&&g&&has('app_admin')){const rd=new FileReader();rd.onload=()=>{S.gban[g]=rd.result;logit('Updated banner for '+g);draw()};rd.readAsDataURL(f)}}
else if(d.rv!==undefined||d.re!==undefined){if(canAssign()){const raw=d.rv!==undefined?d.rv:d.re,[id,k]=raw.split(':'),f=S.rd[id]||(S.rd[id]=effRole(id));if(d.rv!==undefined){const i=f.v.indexOf(k);if(i<0)f.v.push(k);else{f.v.splice(i,1);f.e=f.e.filter(x=>x!==k)}}else{const i=f.e.indexOf(k);if(i<0){f.e.push(k);if(!f.v.includes(k))f.v.push(k)}else f.e.splice(i,1)}}}
else if(d.crn!==undefined){if(has('app_admin')&&S.custom[d.crn]&&t.value.trim()){const n=t.value.trim();RN[d.crn]=n;ROLES.find(r=>r[0]===d.crn)[1]=n;logit('Renamed a role to '+n)}}
else if(d.rg!==undefined){const[id,g]=d.rg.split(':'),c=S.rt[id];if(has('app_admin')&&c){const i=c.indexOf(g);i<0?c.push(g):c.splice(i,1);logit(`${i<0?'Added':'Removed'} tab ${g} ${i<0?'to':'from'} ${RN[id]}`)}}
else if(d.addbdoc!==undefined){const f=t.files[0];if(f&&canEdit('bm.bdoc')&&!S.mock){const n=f.name.replace(/\.[^.]+$/,'');S.bdocs.push({id:'b'+Date.now(),n,b:'Uploaded file: '+f.name+'\n',by:'',at:''});logit(`uploaded document '${n}'`,'doc');toast()}}
else if(d.grp!==undefined){if(canAssign()){const f=S.ad[d.grp]||(S.ad[d.grp]=effAcct(d.grp));f.g=t.value}}
else if(d.poster!==undefined){const f=t.files[0];if(f&&canEdit('ym.ses')){const rd=new FileReader();rd.onload=()=>{S.poster[d.poster]=rd.result;draw()};rd.readAsDataURL(f)}}
else if(d.addniy!==undefined){const f=t.files[0];if(f&&(canEdit('niy')||has('app_admin')))S.niy.push([$('#nt').value.trim()||f.name.replace(/\.[^.]+$/,''),$('#nc').value])}
else if(d.ppt!==undefined){const[i,k]=d.ppt.split(':');if(t.files[0]&&canEdit('ym.ses'))(S.ppt[i]=S.ppt[i]||{})[k]=t.files[0].name}
else if(d.adddoc!==undefined){const f=t.files[0];if(f&&canEdit('ym.adm')&&!S.mock){const n=f.name.replace(/\.[^.]+$/,'');S.docs.push({id:'y'+Date.now(),n,b:'Uploaded file: '+f.name+'\n',by:'',at:''});logit(`uploaded document '${n}'`,'doc');toast()}}
else if(d.addres!==undefined){const f=t.files[0];if(f&&canEdit('ym.res'))S.res.push([$('#rt').value.trim()||f.name.replace(/\.[^.]+$/,''),$('#rk').value])}
draw()});
draw();
</script>
